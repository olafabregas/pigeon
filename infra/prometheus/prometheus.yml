global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: core
    metrics_path: /actuator/prometheus
    # DNS-based discovery so every scaled core replica is scraped
    dns_sd_configs:
      - names: ["core"]
        type: A
        port: 8081
        refresh_interval: 10s
