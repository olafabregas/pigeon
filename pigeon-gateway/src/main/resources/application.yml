server:
  port: 8080

spring:
  application:
    name: pigeon-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: core-api
          uri: ${CORE_URL:http://localhost:8081}
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: coreCb
                fallbackUri: forward:/fallback
        # Examples of header / weight based routing (enable by uncommenting):
        # - id: core-canary
        #   uri: ${CORE_CANARY_URL:http://localhost:8082}
        #   predicates:
        #     - Path=/api/**
        #     - Header=X-Canary, true
        # - id: core-weighted-a
        #   uri: ${CORE_URL:http://localhost:8081}
        #   predicates:
        #     - Path=/api/**
        #     - Weight=core, 90
        # - id: core-weighted-b
        #   uri: ${CORE_B_URL:http://localhost:8082}
        #   predicates:
        #     - Path=/api/**
        #     - Weight=core, 10

pigeon:
  gateway:
    rate-limit:
      enabled: true
      rps: ${RATE_LIMIT_RPS:10}
      burst: ${RATE_LIMIT_BURST:20}
      path-pattern: /api/**

resilience4j:
  circuitbreaker:
    instances:
      coreCb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_WINDOW_SIZE:10}
        minimum-number-of-calls: ${CB_MIN_CALLS:5}
        failure-rate-threshold: ${CB_FAILURE_RATE:50}
        slow-call-duration-threshold: ${CB_SLOW_CALL_MS:2000ms}
        slow-call-rate-threshold: ${CB_SLOW_RATE:50}
        wait-duration-in-open-state: ${CB_OPEN_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:3}
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  timelimiter:
    instances:
      coreCb:
        timeout-duration: ${CB_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: pigeon-gateway

logging:
  level:
    root: INFO
