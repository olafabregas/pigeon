server:
  port: 8081

spring:
  application:
    name: pigeon-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pigeon}
    username: ${DB_USER:pigeon}
    password: ${DB_PASS:pigeon}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # Required for outbox SENT advancement. Soft-defaulted by the starter EPP when
    # unset, but keep explicit in the demo so a stale starter JAR cannot silently
    # disable confirms (CorrelationData futures never complete → SENT stuck).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        pigeon.outbox.dispatch.latency: true
    tags:
      application: pigeon-core

pigeon:
  demo:
    enabled: ${PIGEON_DEMO_ENABLED:true}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    flyway:
      enabled: ${OUTBOX_FLYWAY_ENABLED:true}
    scheduling:
      enabled: ${OUTBOX_SCHEDULING_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${OUTBOX_POLL_MS:500}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    base-backoff-ms: ${OUTBOX_BASE_BACKOFF_MS:1000}
    max-backoff-ms: ${OUTBOX_MAX_BACKOFF_MS:300000}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    broker-down-backoff-ms: ${OUTBOX_BROKER_DOWN_BACKOFF_MS:5000}
    sent-retention-ms: ${OUTBOX_SENT_RETENTION_MS:604800000}
    sent-cleanup-interval-ms: ${OUTBOX_SENT_CLEANUP_INTERVAL_MS:3600000}
    claim-lease-ms: ${OUTBOX_CLAIM_LEASE_MS:60000}
  consumer:
    enabled: ${CONSUMER_ENABLED:true}
